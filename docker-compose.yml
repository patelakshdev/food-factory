services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: food_factory
      MARIADB_USER: food_factory
      MARIADB_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: food_factory
      DB_USERNAME: food_factory
      DB_PASSWORD: secret
      ADMIN_EMAIL: admin@foodfactory.local
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  db_data: